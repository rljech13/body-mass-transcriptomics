[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "body-mass-transcriptomics"
version = "0.3.0"
description = "Existing body-mass transcriptomics workflows consolidated into scientific modules"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
bodymass = "bodymass.cli:main"

[tool.setuptools]
packages = ["bodymass"]
